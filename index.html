<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>궁합 마을</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* VOICE: 눈 내리는 저녁, 불 켜진 작은 마을을 산책하다 마음에 드는 이웃에게 고백하는 설렘
   IDEA: 위에서 내려다본 겨울 마을 모형. 내 캐릭터를 조이스틱으로 움직인다
   PICTURE: 화면보다 큰 눈 마을 지도 자체가 주인공, 카메라가 나를 따라온다
   COLOUR and TYPE: 눈 흰색·얼음 하늘색 바탕, 따뜻한 창문 노랑, 하트 핑크 / Jua + Gowun Dodum
   LAYOUT: 위 상태줄, 가운데 큰 지도(조이스틱 겹침), 아래 정보 카드 */
:root{color-scheme:light;--ink:#1E2A44;--sub:#44506B;--pink:#C8325F;--heart:#F0558A;--line:#1E2A44;--snow:#EEF4FB;--ice:#CFE4F5}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:#22304F;color:var(--ink);font:16px/1.5 'Gowun Dodum',sans-serif;overflow-x:clip}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:#2B3A5E}
header{padding:calc(12px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff}
h1{margin:0;font:400 26px/1.05 'Jua',sans-serif;display:flex;align-items:center;gap:6px}
.stats{display:flex;gap:5px;font-size:13px;flex-wrap:wrap;justify-content:flex-end}
.stats span{border-radius:8px;padding:2px 8px;background:#3E5080}
.stats .c{background:#7A2A4F}
.banner{margin:0 12px 8px;padding:8px 12px;border-radius:12px;background:#FFF6D6;border:2px solid #C9A227;font-size:14px;line-height:20px}
.banner[hidden]{display:none}
.vp{position:relative;margin:0 10px;height:min(560px,calc(100vh - 290px));min-height:360px;border:3px solid var(--line);border-radius:18px;overflow:hidden;background:var(--snow);touch-action:none;isolation:isolate}
.world{position:absolute;left:0;top:0;width:1100px;height:1500px;will-change:transform;background-color:var(--snow);background-image:radial-gradient(#DCE7F3 1.4px,transparent 1.6px),radial-gradient(#FFFFFF 2px,transparent 2.2px);background-size:34px 34px,52px 52px;background-position:0 0,17px 26px}
.o{position:absolute}
.path{position:absolute;background:#C9D6E4;border:3px solid #B3C3D6}
.plaza{position:absolute;border-radius:50%;background:#D8E3EF;border:4px solid #B3C3D6}
.sh{position:absolute;border-radius:50%;background:rgba(40,60,100,.18)}
.glow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,206,92,.5),rgba(255,206,92,0));pointer-events:none}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.tw{animation:tw 1.6s ease-in-out infinite}
@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.8}100%{transform:translate(10px,-40px) scale(1.4);opacity:0}}
.puff{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;animation:puff 3s ease-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.15) translateY(-1px)}}
.flame{transform-origin:bottom;animation:flick .5s ease-in-out infinite}
@keyframes fall{from{transform:translate(0,-20px)}to{transform:translate(24px,600px)}}
.snow{position:absolute;inset:0;pointer-events:none;z-index:3000;overflow:hidden}
.snow i{position:absolute;top:0;border-radius:50%;background:#fff;opacity:.9;animation:fall linear infinite;box-shadow:0 0 2px rgba(80,110,160,.5)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-2px) rotate(-3deg)}75%{transform:translateY(-2px) rotate(3deg)}}
.res.walking .px{animation:walk .36s linear infinite}
@media (prefers-reduced-motion:reduce){.tw,.puff,.flame,.bob,.res.walking .px{animation:none}.snow{display:none}}
.px{display:block;filter:drop-shadow(1px 0 0 #1E2A44) drop-shadow(-1px 0 0 #1E2A44) drop-shadow(0 1px 0 #1E2A44) drop-shadow(0 -1px 0 #1E2A44)}
.res{position:absolute;left:0;top:0;width:44px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.res .fig{position:relative;width:36px;height:48px}
.res.left .fig{transform:scaleX(-1)}
.res .sh{left:3px;bottom:-4px;width:30px;height:8px}
.tag{font-size:12px;line-height:17px;padding:0 6px;border-radius:999px;background:#fff;border:1.5px solid var(--line);white-space:nowrap;max-width:76px;overflow:hidden;text-overflow:ellipsis}
.res.me .tag{background:#FFD84D;font-weight:700}
.res.cp .tag{background:#FFD2E1}
.res.me.cp .tag{background:linear-gradient(90deg,#FFD84D 50%,#FFD2E1 50%)}
.res.sel .tag{outline:3px solid var(--heart);outline-offset:1px}
.res:focus-visible{outline:3px solid #2457C5;outline-offset:2px;border-radius:10px}
.wait{position:absolute;left:30px;top:-12px;font-size:16px}
.badge{position:absolute;left:0;top:0;display:flex;align-items:center;gap:2px;pointer-events:none}
.badge b{font:400 13px/18px 'Jua',sans-serif;background:#fff;color:var(--pink);border:1.5px solid var(--heart);border-radius:6px;padding:0 4px}
.board{font:400 14px/17px 'Jua',sans-serif;background:#8A5A33;border:2px solid #3E2614;border-radius:5px;padding:3px 8px;color:#FFEBD0;text-align:center;white-space:nowrap}
.board small{display:block;font:12px/15px 'Gowun Dodum',sans-serif}
.tapobj{background:none;border:0;padding:0;cursor:pointer}
.tapobj:focus-visible{outline:3px solid #2457C5;outline-offset:2px;border-radius:10px}
.joy{position:absolute;left:14px;bottom:14px;width:112px;height:112px;border-radius:50%;background:rgba(30,42,68,.28);border:3px solid rgba(255,255,255,.75);z-index:4000;touch-action:none}
.joy .knob{position:absolute;left:30px;top:30px;width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.joy[hidden]{display:none}
.tobtn{position:absolute;right:12px;bottom:14px;z-index:4000;min-height:44px;padding:0 12px;border-radius:12px;border:3px solid var(--line);background:#fff;font:400 15px 'Jua',sans-serif;cursor:pointer}
.tobtn[hidden]{display:none}
.hint[hidden]{display:none}.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4000;font-size:13px;background:rgba(30,42,68,.75);color:#fff;border-radius:999px;padding:3px 12px;white-space:nowrap;pointer-events:none}
.card{padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.cardin{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ct{font:400 20px/1.25 'Jua',sans-serif;color:var(--pink)}
.cd{font-size:14px;line-height:20px;color:var(--sub)}
.why{display:flex;flex-wrap:wrap;gap:4px}.why:empty{display:none}.why span{font-size:12px;background:#FFE3EC;color:#8F1F44;border-radius:6px;padding:1px 6px}.why span.neg{background:#EEF1F5;color:#44506B}
.note{font-size:13px;background:#FFE3EC;color:#8F1F44;border-radius:8px;padding:6px 8px}
.note[hidden]{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions:empty{display:none}
.btn{min-height:44px;border-radius:12px;border:3px solid var(--line);background:var(--pink);color:#fff;font:400 17px 'Jua',sans-serif;padding:0 14px;cursor:pointer;box-shadow:0 3px 0 #7A1E3D}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7A1E3D}
.btn.ghost{background:#fff;color:var(--ink);font-size:15px;box-shadow:0 3px 0 #9AA6BF}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.sw:focus-visible{outline:3px solid #2457C5;outline-offset:3px}
.foot{font-size:12px;color:#C9D3EA;padding:0 16px 10px;text-align:center}
dialog{border:3px solid var(--line);border-radius:18px;padding:0;width:min(440px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(20,28,50,.55)}
.dl{padding:18px;display:flex;flex-direction:column;gap:12px}
.dl h2{margin:0;font:400 24px 'Jua',sans-serif}
.f{display:flex;flex-direction:column;gap:4px}
.f label,.f .lb{font-size:14px;font-weight:700}
.in{height:48px;border:2px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:16px;color:var(--ink);background:#fff;width:100%}
.in:focus-visible{outline:3px solid #2457C5;outline-offset:2px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;min-height:44px}
.chk input{width:20px;height:20px;margin:0}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{min-width:36px;height:36px;border-radius:999px;border:2px solid var(--line);cursor:pointer;padding:0 8px;font:13px 'Gowun Dodum',sans-serif;background:#fff;color:var(--ink)}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--line)}
.preview{display:flex;justify-content:center;padding:8px;background:var(--snow);border-radius:12px;height:96px}
.priv{margin:0;font-size:13px;line-height:19px;color:var(--sub);background:#F1F5F9;border-radius:8px;padding:8px 10px}
.err{color:#B42318;font-size:14px;min-height:20px;margin:0}
.big{font:400 40px/1 'Jua',sans-serif;color:var(--pink);text-align:center}
</style>
</head>
<body>
<div class="app">
<header>
<h1><svg width="24" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="0" width="2" height="1" fill="#F0558A"/><rect x="4" y="0" width="2" height="1" fill="#F0558A"/><rect x="0" y="1" width="7" height="2" fill="#F0558A"/><rect x="1" y="3" width="5" height="1" fill="#F0558A"/><rect x="2" y="4" width="3" height="1" fill="#F0558A"/><rect x="3" y="5" width="1" height="1" fill="#F0558A"/><rect x="1" y="1" width="1" height="1" fill="#FFD2E1"/></svg>궁합 마을</h1>

</div>
<div class="card" aria-live="polite">

<div class="cd" id="cd">잠시만 기다려 주세요.</div>
<div class="why" id="why"></div>
<div class="note" id="note" hidden></div>
<div class="actions" id="actions"></div>
</div>
</div>
<p class="foot">궁합 점수는 전통 사주 궁합을 단순화한 게임 규칙이에요. 재미로 즐겨 주세요.</p>
</div>

<dialog id="dlg" aria-labelledby="dlgT">
<form class="dl" id="form" novalidate>
<h2 id="dlgT">궁합 마을에 입장하기</h2>
<div class="preview" id="pv" aria-hidden="true"></div>
<div class="f"><label for="nick">마을에서 쓸 이름</label><input id="nick" class="in" maxlength="8" autocomplete="off" placeholder="예: 몽글"></div>
<div class="f"><label for="bd">태어난 날 (양력)</label><input id="bd" class="in" type="date" min="1930-01-01" max="2026-12-31"></div>
<div class="f"><label for="bt">태어난 시간</label><input id="bt" class="in" type="time">
<label class="chk"><input id="bu" type="checkbox">시간을 몰라요</label></div>
<div class="f"><span class="lb" id="styL">머리 모양</span><div class="sws" id="styS" role="group" aria-labelledby="styL"></div></div>
<div class="f"><span class="lb" id="hairL">머리 색</span><div class="sws" id="hairS" role="group" aria-labelledby="hairL"></div></div>
<div class="f"><span class="lb" id="shirtL">옷 색</span><div class="sws" id="shirtS" role="group" aria-labelledby="shirtL"></div></div>
<p class="priv">생년월일시 자체는 저장하지 않아요. 궁합 계산에 필요한 사주 글자만 저장되고, 다른 주민에게는 이름·위치·궁합 점수만 보여요.</p>
<p class="err" id="ferr"></p>
<div class="actions"><button class="btn" type="submit" id="go">마을 들어가기</button><button class="btn ghost" type="button" id="cancel">닫기</button></div>
</form>
</dialog>

<dialog id="cfm" aria-labelledby="cfmT">
<div class="dl">
<h2 id="cfmT">고백이 도착했어요 💌</h2>
<div class="preview" id="cfmPv" aria-hidden="true"></div>
<p class="cd" id="cfmD" style="margin:0"></p>
<div class="big" id="cfmS"></div>
<div class="why" id="cfmW"></div>
<div class="actions"><button class="btn" type="button" id="yes">좋아요, 커플 할래요</button><button class="btn ghost" type="button" id="no">미안해요</button></div>
</div>
</dialog>

const TERM = [[1,6],[2,4],[3,6],[4,5],[5,6],[6,6],[7,7],[8,8],[9,8],[10,8],[11,7],[12,7]];

const rel = (a, b) => a === b ? 'same' : ((a + 1) % 5 === b || (b + 1) % 5 === a) ? 'gen' : 'ctl';

  for (let e = 0; e < 5; e++) { if (ca[e] === 0 && cb[e] >= 2) comp += 3; if (cb[e] === 0 && ca[e] >= 2) comp += 3; }

/* ---------- 상태 ---------- */
let residents = new Map();   // id -> 정리된 주민 데이터
let myId = null, api = null, loaded = false, sel = null, wish = 0, notice = '', leaving = false, breaking = false;
const me = { x: SPAWN.x, y: SPAWN.y, init: false, moving: false, lastSave: 0, savedX: 0, savedY: 0 };
const disp = new Map();       // id -> {x,y,el,sig,moving,left}
let couples = [], partnerOf = new Map();
const cam = { x: 0, y: 0, free: false };
const joy = { x: 0, y: 0, on: false }, keys = new Set();
const vp = $('vp'), world = $('world');

const points = (a, b) => a && b && (a.partner === b.id || a.confessTo === b.id);
function computeCouples() {
  couples = []; partnerOf = new Map();
  const list = [...residents.values()].sort((a, b) => a.id < b.id ? -1 : 1);
  for (const a of list) {
    if (partnerOf.has(a.id)) continue;
    for (const id of [a.partner, a.confessTo]) {
      const b = id && residents.get(id);
      if (b && !partnerOf.has(b.id) && points(b, a)) {
        const m = match(a.p, b.p); couples.push({ a, b, ...m });
        partnerOf.set(a.id, b.id); partnerOf.set(b.id, a.id); break;
      }
    }
  }
}
const isMe = (id) => id === myId;
const mine = () => residents.get(myId);
const posOf = (id) => { const d = disp.get(id); return d ? { x: d.x, y: d.y } : null; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

/* ---------- 주민 그리기 ---------- */
function syncPeople() {
  const box = $('people');
  for (const [id, d] of disp) if (!residents.has(id)) { d.el.remove(); disp.delete(id); }
  for (const r of residents.values()) {
    let d = disp.get(r.id);
    if (!d) {
      const el = document.createElement('button'); el.type = 'button'; el.className = 'res'; el.dataset.id = r.id;
      box.appendChild(el);
      const start = isMe(r.id) ? me : r;
      d = { x: start.x, y: start.y, el, sig: '', moving: false, left: false };
      disp.set(r.id, d);
    }
    const waiting = isMe(r.id) && r.confessTo && !partnerOf.has(r.id);
    const sig = r.nick + r.look.join() + (waiting ? 'w' : '');
    if (d.sig !== sig) {
      d.el.innerHTML = `<span class="fig"><span class="sh"></span>${sprite(r.look)}</span><span class="tag">${esc(r.nick)}</span>${waiting ? '<span class="wait bob" aria-hidden="true">💌</span>' : ''}`;
      d.sig = sig;
    }
    d.el.classList.toggle('me', isMe(r.id));
    d.el.classList.toggle('cp', partnerOf.has(r.id));
    d.el.classList.toggle('sel', sel && sel.id === r.id);
    const pn = partnerOf.get(r.id), pr = pn && residents.get(pn);
    d.el.setAttribute('aria-label', `${r.nick}${isMe(r.id) ? ' (나)' : ''}${pr ? `, ${pr.nick}와 커플` : ', 솔로'}`);
  }
  // 하트 연결선
  const svg = $('links');
  svg.innerHTML = couples.map((c, i) => `<line id="ln${i}" stroke="#F0558A" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" opacity=".85"/>`).join('');
  box.querySelectorAll('.badge').forEach((b) => b.remove());
  couples.forEach((c, i) => { const b = document.createElement('div'); b.className = 'badge'; b.id = 'bd' + i; b.innerHTML = `<span class="bob">${HEART(22)}</span><b>${c.score}</b>`; box.appendChild(b); });
  $('stR').textContent = `주민 ${residents.size}명`;
  $('stC').textContent = `커플 ${couples.length}쌍`;
  $('stS').textContent = `솔로 ${residents.size - couples.length * 2}명`;
}

/* ---------- 매 프레임 ---------- */
let last = performance.now(), inRangeShown = null;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  // 내 이동
  let vx = joy.x, vy = joy.y;

  if (keys.has('ArrowRight') || keys.has('d')) vx += 1;
  if (keys.has('ArrowUp') || keys.has('w')) vy -= 1;
  if (keys.has('ArrowDown') || keys.has('s')) vy += 1;

function showBanner(t) { const b = $('banner'); b.textContent = t; b.hidden = !t; }

/* ---------- 미리보기 모드 ---------- */
function startDemo() {
  showBanner('미리보기 모드예요. 예시 주민들과 이 화면에서만 놀아 볼 수 있어요.');
  const S = [['몽글',1996,3,2,10],['차차',1995,7,21,null],['보리',1993,11,9,22],['율무',1998,5,5,7],['단비',1990,12,25,15],['호두',1994,8,14,3],['콩떡',1997,1,30,12],['모카',1999,6,18,19],['누리',1992,9,9,8],['토리',2000,4,1,null]];
  const spots = [[480,820],[620,830],[300,760],[360,760],[760,600],[820,640],[600,1000],[250,640],[700,1200],[400,1300]];
  const npcs = S.map(([n, y, mo, d, h], i) => ({ id: 'n' + i, nick: n, p: pillars(y, mo, d, h), look: [i % HAIR.length, (i * 3) % SHIRT.length, i % 4], x: spots[i][0], y: spots[i][1], partner: null, confessTo: null, declined: null }));
  [[0,1],[2,3],[4,5]].forEach(([a, b]) => { npcs[a].partner = npcs[b].id; npcs[b].partner = npcs[a].id; });
  let meDoc = null; myId = 'me';
  const emit = () => onData(npcs.concat(meDoc ? [meDoc] : []).map((r) => ({ ...r, legacy: false })), true);
  api = {
    create: async (data) => { meDoc = { id: 'me', ...data }; emit(); setTimeout(npcConfess, 15000); },
    update: async (f) => { if (!meDoc) return; Object.assign(meDoc, f); const isPos = Object.keys(f).every((k) => k === 'x' || k === 'y'); if (!isPos) emit(); if (f.confessTo) setTimeout(() => npcReply(f.confessTo), 1800); },
    remove: async () => { meDoc = null; npcs.forEach((n) => { if (n.partner === 'me') n.partner = null; if (n.confessTo === 'me') n.confessTo = null; }); emit(); }
  };
  function npcReply(id) {
    const n = npcs.find((x) => x.id === id); if (!n || !meDoc || meDoc.confessTo !== id) return;
    if (!n.partner && match(meDoc.p, n.p).score >= 70) n.partner = 'me'; else n.declined = 'me';
    emit();
  }
  function npcConfess() {
    if (!meDoc || partnerOf.has('me') || meDoc.confessTo) return;
    const free = npcs.filter((n) => !partnerOf.has(n.id)).sort((a, b) => match(meDoc.p, b.p).score - match(meDoc.p, a.p).score)[0];
    if (free) { free.confessTo = 'me'; emit(); }
  }
  setInterval(() => { // 예시 주민 산책
    npcs.forEach((n, i) => { if (Math.random() < .35) { n.x = clamp(spots[i][0] + (Math.random() - .5) * 160, 40, MAPW - 40); n.y = clamp(spots[i][1] + (Math.random() - .5) * 120, 80, MAPH - 40); } });
    onData(npcs.concat(meDoc ? [meDoc] : []).map((r) => ({ ...r, legacy: false })), false);
  }, 3000);
  emit();
}

/* ---------- Firebase 모드 ---------- */
async function startLive() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  let A, Au, F;
  try { [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]); }
  catch (e) { loaded = true; showBanner('Firebase를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); renderCard(); return; }
  const app = A.initializeApp(FIREBASE_CONFIG);
  const auth = Au.getAuth(app), fs = F.getFirestore(app);
  try { const cred = await Au.signInAnonymously(auth); myId = cred.user.uid; }
  catch (e) { showBanner('익명 로그인을 하지 못했어요. Firebase 인증 설정(익명 로그인, 승인된 도메인)을 확인해 주세요.'); }
  if (myId) {
    const ref = F.doc(fs, 'residents', myId);
    api = {
      create: (data) => F.setDoc(ref, { ...data, joinedAt: F.serverTimestamp() }),
      update: (f) => F.updateDoc(ref, f),
      remove: () => F.deleteDoc(ref)
    };
  }
  const timer = setTimeout(() => { if (!loaded) { loaded = true; showBanner('마을 정보를 아직 불러오지 못했어요. 연결되면 자동으로 나타나요.'); renderCard(); } }, 10000);
  F.onSnapshot(F.collection(fs, 'residents'), (snap) => {
    clearTimeout(timer);
    if ($('banner').textContent.startsWith('마을 정보를')) showBanner('');
    onData(snap.docs.map((d) => clean(d.id, d.data())).filter(Boolean), !snap.metadata.fromCache);
  }, (e) => {
    clearTimeout(timer); loaded = true;
    showBanner(e && e.code === 'permission-denied' ? '마을 정보를 읽을 권한이 없어요. Firebase 보안 규칙을 확인해 주세요.' : '마을 정보를 불러오지 못했어요. 페이지를 새로고침해 주세요.');
    renderCard();
  });
}

buildWorld();
cam.x = 550 - vp.clientWidth / 2; cam.y = 705 - vp.clientHeight / 2;
renderCard();
requestAnimationFrame(frame);
if (DEMO) startDemo(); else startLive();
</script>
