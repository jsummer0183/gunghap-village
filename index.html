<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>궁합 마을</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* VOICE: 별이 쏟아지는 밤, 언덕 위에 모인 동네 주민들. 설레고 장난스럽게
   IDEA: 밤하늘 아래 작은 마을 모형. 짝이 된 주민은 손을 잡고 하트로 이어진다
   PICTURE: 행성·별·불 켜진 집이 있는 밤 마을 지도가 화면의 주인공
   COLOUR and TYPE: 깊은 남색 하늘, 밤 잔디색, 하트 핑크와 창문 노랑 포인트 / Jua + Gowun Dodum
   LAYOUT: 폰 폭의 세로 마을, 아래에 붙은 내 상태 카드 */
:root{color-scheme:dark;--bg:#0B0E2E;--panel:#171C52;--line:#0A0C24;--ink:#F4F2FF;--sub:#C9CCF2;--pink:#FF7EA8;--btn:#CF3768;--gold:#FFD66B}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Gowun Dodum',sans-serif;overflow-x:clip}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#0E1238}
header{padding:calc(16px + env(safe-area-inset-top)) 16px 10px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font:400 30px/1.05 'Jua',sans-serif;display:flex;align-items:center;gap:8px}
.pill{font-size:13px;background:#232A6E;border:2px solid #4A55B8;border-radius:999px;padding:3px 10px;white-space:nowrap}
.stats{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.stats span{border-radius:8px;padding:3px 8px;background:#232A6E}
.stats .c{background:#4A1F45;color:#FFC2D6}.stats .s{background:#3A3352;color:#E6DCC8}
.banner{margin:0 12px 10px;padding:10px 12px;border-radius:12px;background:#2E2A12;border:2px solid #9C8424;color:#FFF1BF;font-size:14px;line-height:20px}
.banner[hidden]{display:none}
.village{position:relative;isolation:isolate;margin:0 12px;border:3px solid #39418F;border-radius:18px;overflow:hidden;background:#0E1238;box-shadow:0 0 0 3px var(--line)}
.sky1,.sky2,.sky3{position:absolute;left:0;right:0}
.sky1{top:0;height:70px;background:#0E1238}.sky2{top:62px;height:50px;background:#161C55}.sky3{top:104px;height:60px;background:#21297A}
.ground{position:absolute;left:0;right:0;top:150px;bottom:0;background-color:#24583A;background-image:linear-gradient(45deg,#285F3E 25%,transparent 25%,transparent 75%,#285F3E 75%),linear-gradient(45deg,#285F3E 25%,transparent 25%,transparent 75%,#285F3E 75%);background-size:8px 8px;background-position:0 0,4px 4px}
.hill{position:absolute;left:-25%;width:150%;height:90px;top:128px;border-radius:50%;background:#2F7A3E;border-top:4px solid #5BAA4E}
.terrace{position:absolute;left:-10%;width:120%;height:80px;border-radius:50% 50% 0 0/40px 40px 0 0;border-top:3px solid #3C8A49}
.obj{position:absolute}
.star{position:absolute;width:2px;height:2px;background:#fff}
.star.b{width:3px;height:3px;background:#FFF4C2}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes shoot{0%{transform:translate(0,0) rotate(-27deg);opacity:0}6%{opacity:1}22%{transform:translate(-220px,110px) rotate(-27deg);opacity:0}100%{transform:translate(-220px,110px) rotate(-27deg);opacity:0}}
.shoot{position:absolute;width:46px;height:2px;background:linear-gradient(90deg,#fff,rgba(255,255,255,0));transform-origin:left;opacity:0;animation:shoot 7s ease-in infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes fly{0%,100%{opacity:.2;transform:translate(0,0)}50%{opacity:1;transform:translate(4px,-6px)}}
.fly{position:absolute;width:4px;height:4px;border-radius:50%;background:#FFF07A;box-shadow:0 0 8px 3px rgba(255,240,122,.55);animation:fly 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.tw,.shoot,.bob,.fly{animation:none}.shoot{display:none}}
.shadow{position:absolute;border-radius:50%;background:rgba(5,8,30,.45)}
.px{position:relative;display:block;filter:drop-shadow(1px 0 0 #0A0C24) drop-shadow(-1px 0 0 #0A0C24) drop-shadow(0 1px 0 #0A0C24) drop-shadow(0 -1px 0 #0A0C24)}
.person{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:44px}
.fig{position:relative;width:36px;height:48px}.fig.crouch{height:39px}
.tag{font-size:11px;line-height:16px;padding:0 5px;border-radius:999px;background:#F4F2FF;color:#1A1D3F;border:1px solid var(--line);white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis}
.tag.me{background:var(--gold);font-weight:700}
.pick{background:none;border:0;padding:0;margin:0;cursor:pointer;font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.pick:focus-visible,.btn:focus-visible,.sw:focus-visible{outline:3px solid #8FB4FF;outline-offset:3px;border-radius:12px}
.cp{display:flex;flex-direction:column;align-items:center;width:88px}
.cp .top2{position:relative;width:88px;height:34px}
.cp .arc{position:absolute;left:0;top:0}
.cp .heart{position:absolute;left:33px;top:0}
.cp .score{position:absolute;left:56px;top:2px;font:400 13px/18px 'Jua',sans-serif;background:#2A1638;color:#FFC2D6;border:1.5px solid var(--pink);border-radius:6px;padding:0 4px}
.pair{position:relative;display:flex}
.hand{position:absolute;left:34px;top:31px;width:20px;height:3px;background:#FFE0C7;box-shadow:0 0 0 1px #0A0C24}
.sel .tag{outline:2px solid var(--pink);outline-offset:1px}
.board{font:400 13px/16px 'Jua',sans-serif;background:#8A5A33;border:2px solid #3E2614;border-radius:4px;padding:2px 7px;color:#FFEBD0;text-align:center;white-space:nowrap}
.board small{display:block;font:11px/14px 'Gowun Dodum',sans-serif}
.glow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,214,107,.45),rgba(255,214,107,0))}
.card{position:sticky;bottom:0;z-index:10;margin-top:12px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:#0E1238}
.cardin{background:var(--panel);border:3px solid #39418F;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 0 3px var(--line)}
.ct{font:400 20px/1.25 'Jua',sans-serif;color:var(--pink)}
.cd{font-size:14px;line-height:20px;color:var(--sub)}
.why{display:flex;flex-wrap:wrap;gap:4px}.why span{font-size:12px;background:#4A1F45;color:#FFD2E1;border-radius:6px;padding:1px 6px}.why span.neg{background:#2C3266;color:#D6DAFF}
.note{font-size:13px;background:#4A1F45;color:#FFD2E1;border-radius:8px;padding:6px 8px}
.note[hidden]{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;border-radius:12px;border:3px solid var(--line);background:var(--btn);color:#fff;font:400 18px 'Jua',sans-serif;padding:0 16px;cursor:pointer;box-shadow:0 3px 0 #7A1E3D}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7A1E3D}
.btn.ghost{background:#2C3375;color:var(--ink);font-size:15px;box-shadow:0 3px 0 #141850}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.foot{font-size:13px;color:#9EA3D6;padding:0 16px 10px;text-align:center}
dialog{border:3px solid #39418F;border-radius:18px;padding:0;width:min(440px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(5,6,20,.7)}
form{padding:18px;display:flex;flex-direction:column;gap:12px}
form h2{margin:0;font:400 24px 'Jua',sans-serif}
.f{display:flex;flex-direction:column;gap:4px}
.f label,.f .lb{font-size:14px;font-weight:700}
.in{height:48px;border:2px solid #4A55B8;border-radius:10px;padding:0 12px;font:inherit;font-size:16px;color:var(--ink);background:#0E1238;width:100%;color-scheme:dark}
.in:focus-visible{outline:3px solid #8FB4FF;outline-offset:2px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;min-height:44px}
.chk input{width:20px;height:20px;margin:0}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{min-width:36px;height:36px;border-radius:999px;border:2px solid #0A0C24;cursor:pointer;padding:0 8px;font:13px 'Gowun Dodum',sans-serif;color:#1A1D3F}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--panel),0 0 0 6px #F4F2FF}
.preview{display:flex;justify-content:center;padding:6px;background:#0E1238;border-radius:12px}
.priv{margin:0;font-size:13px;line-height:19px;color:var(--sub);background:#0E1238;border-radius:8px;padding:8px 10px}
.err{color:#FFB4B4;font-size:14px;min-height:20px;margin:0}
</style>
</head>
<body>
<div class="app">
<header>
<div class="top"><h1><svg width="26" height="26" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="0" width="2" height="1" fill="#FF7EA8"/><rect x="4" y="0" width="2" height="1" fill="#FF7EA8"/><rect x="0" y="1" width="7" height="2" fill="#FF7EA8"/><rect x="1" y="3" width="5" height="1" fill="#FF7EA8"/><rect x="2" y="4" width="3" height="1" fill="#FF7EA8"/><rect x="3" y="5" width="1" height="1" fill="#FF7EA8"/><rect x="1" y="1" width="1" height="1" fill="#FFD2E1"/></svg>궁합 마을</h1><span class="pill">기준 점수 <b id="thr">70</b>점</span></div>
<div class="stats"><span id="stR">주민 0명</span><span class="c" id="stC">커플 0쌍</span><span class="s" id="stS">솔로 0명</span></div>
</header>
<p class="banner" id="banner" hidden></p>
<div class="village" id="village" aria-label="밤하늘 아래 궁합 마을 지도"></div>
<div class="card" aria-live="polite">
<div class="cardin">
<div class="ct" id="ct">마을을 불러오는 중이에요</div>
<div class="cd" id="cd">잠시만 기다려 주세요.</div>
<div class="why" id="why"></div>
<div class="note" id="note" hidden></div>
<div class="actions" id="actions"></div>
</div>
</div>
<p class="foot">궁합 점수는 전통 사주 궁합을 단순화한 게임 규칙이에요. 재미로 즐겨 주세요.</p>
</div>

<dialog id="dlg" aria-labelledby="dlgT">
<form id="form" novalidate>
<h2 id="dlgT">궁합 마을에 입장하기</h2>
<div class="preview" id="pv" aria-hidden="true"></div>
<div class="f"><label for="nick">마을에서 쓸 이름</label><input id="nick" class="in" maxlength="8" autocomplete="off" placeholder="예: 몽글"></div>
<div class="f"><label for="bd">태어난 날 (양력)</label><input id="bd" class="in" type="date" min="1930-01-01" max="2026-12-31"></div>
<div class="f"><label for="bt">태어난 시간</label><input id="bt" class="in" type="time">
<label class="chk"><input id="bu" type="checkbox">시간을 몰라요</label></div>
<div class="f"><span class="lb" id="styL">머리 모양</span><div class="sws" id="styS" role="group" aria-labelledby="styL"></div></div>
<div class="f"><span class="lb" id="hairL">머리 색</span><div class="sws" id="hairS" role="group" aria-labelledby="hairL"></div></div>
<div class="f"><span class="lb" id="shirtL">옷 색</span><div class="sws" id="shirtS" role="group" aria-labelledby="shirtL"></div></div>
<p class="priv">생년월일시 자체는 저장하지 않아요. 궁합 계산에 필요한 사주 글자만 저장되고, 다른 주민 화면에는 이름과 궁합 점수만 보여요.</p>
<p class="err" id="ferr"></p>
<div class="actions"><button class="btn" type="submit" id="go">마을 들어가기</button><button class="btn ghost" type="button" id="cancel">닫기</button></div>
</form>
</dialog>

<script type="module">
/* =====================================================================
   ① Firebase 설정값 붙여넣기
   Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹) > SDK 설정 및 구성 에 나오는

   ===================================================================== */
const FIREBASE_CONFIG = {

const FIREBASE_VERSION = '12.12.0';
const THRESHOLD = 70;

const HAIR = ['#2B2233','#5B3A29','#8A5A2B','#D9A441','#E07AA0','#7C8CF0'];
const SHIRT = ['#6FA8FF','#FF8FB1','#7ED6A4','#FFD66B','#B79CFF','#FF9A6B','#C6E37A','#7FD8E8'];
const STYLES = ['짧은 머리','긴 머리','양갈래','모자'];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 사주 계산 (화면에는 용어를 보여주지 않음) ---------- */
const SE = [0,0,1,1,2,2,3,3,4,4], BE = [4,2,0,0,2,1,1,2,3,3,2,4];
const TERM = [[1,6],[2,4],[3,6],[4,5],[5,6],[6,6],[7,7],[8,8],[9,8],[10,8],[11,7],[12,7]];
function pillars(y, m, d, hh) {
  const before = (mo, da) => m < mo || (m === mo && d < da);
  const yy = before(2, 4) ? y - 1 : y;
  const yi = ((yy - 4) % 60 + 60) % 60, ys = yi % 10, yb = yi % 12;
  let k = 0; for (let i = 0; i < 12; i++) if (!before(TERM[i][0], TERM[i][1])) k = i;
  const mb = before(1, 6) ? 0 : (k + 1) % 12;
  const ms = ((ys % 5) * 2 + 2 + (mb - 2 + 12) % 12) % 10;
  let t = Date.UTC(y, m - 1, d); if (hh != null && hh >= 23) t += 86400000;
  const di = ((Math.round((t - Date.UTC(2000, 0, 7)) / 86400000) % 60) + 60) % 60;
  const ds = di % 10, db = di % 12;
  let h = null; if (hh != null) { const hb = Math.floor(((hh + 1) % 24) / 2); h = [((ds % 5) * 2 + hb) % 10, hb]; }
  return { y: [ys, yb], m: [ms, mb], d: [ds, db], h };
}
const rel = (a, b) => a === b ? 'same' : ((a + 1) % 5 === b || (b + 1) % 5 === a) ? 'gen' : 'ctl';
function counts(p) { const c = [0,0,0,0,0]; for (const k of ['y','m','d','h']) { if (!p[k]) continue; c[SE[p[k][0]]]++; c[BE[p[k][1]]]++; } return c; }
const bkind = (a, b) => (a + b) % 12 === 1 ? 'hap' : (a !== b && a % 4 === b % 4) ? 'sam' : Math.abs(a - b) === 6 ? 'chung' : '';
function match(A, B) {
  let s = 60; const why = [];
  const sa = A.d[0], sb = B.d[0];
  if (Math.abs(sa - sb) === 5) { s += 14; why.push(['서로 끌리는 타고난 성향', 1]); }
  else { const r = rel(SE[sa], SE[sb]); if (r === 'gen') { s += 8; why.push(['서로를 북돋아 주는 사이', 1]); } else if (r === 'same') s += 3; else { s -= 6; why.push(['성향이 달라 밀당이 있어요', 0]); } }
  const dk = bkind(A.d[1], B.d[1]);
  if (dk === 'hap') { s += 10; why.push(['생활 리듬이 착 맞아요', 1]); } else if (dk === 'sam') { s += 7; why.push(['함께 있으면 편안해요', 1]); } else if (dk === 'chung') { s -= 10; why.push(['가끔 부딪힐 수 있어요', 0]); }
  const yk = bkind(A.y[1], B.y[1]);
  if (yk === 'hap' || yk === 'sam') { s += yk === 'hap' ? 5 : 4; why.push(['띠 궁합이 좋아요', 1]); } else if (yk === 'chung') s -= 5;
  const mk = bkind(A.m[1], B.m[1]); s += mk === 'hap' ? 3 : mk === 'sam' ? 2 : mk === 'chung' ? -3 : 0;
  const ca = counts(A), cb = counts(B); let comp = 0;
  for (let e = 0; e < 5; e++) { if (ca[e] === 0 && cb[e] >= 2) comp += 3; if (cb[e] === 0 && ca[e] >= 2) comp += 3; }
  if (comp) { s += Math.min(comp, 9); why.push(['부족한 기운을 채워 줘요', 1]); }
  s += (A.d[0] * 7 + A.d[1] * 3 + A.y[1] * 5 + B.d[0] * 7 + B.d[1] * 3 + B.y[1] * 5) % 4;
  return { score: Math.max(35, Math.min(99, Math.round(s))), why };
}
/* 점수 높은 쌍부터 짝을 정함. 새 주민이 더 높은 점수로 오면 기존 짝이 깨질 수 있음 */
function pairUp(list) {
  const pairs = [];
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const r = match(list[i].p, list[j].p);
    if (r.score >= THRESHOLD) pairs.push({ a: list[i], b: list[j], ...r });
  }
  pairs.sort((x, y) => y.score - x.score || (x.a.id + x.b.id < y.a.id + y.b.id ? -1 : 1));
  const used = new Set(), couples = [];
  for (const pr of pairs) { if (used.has(pr.a.id) || used.has(pr.b.id)) continue; used.add(pr.a.id); used.add(pr.b.id); couples.push(pr); }
  return { couples, solos: list.filter((r) => !used.has(r.id)) };
}

/* ---------- 그림 ---------- */
function hairBits(st, hair, shirt) {
  let s = `<rect x="2" y="1" width="8" height="2" fill="${hair}"/><rect x="1" y="2" width="10" height="3" fill="${hair}"/><rect x="1" y="5" width="1" height="2" fill="${hair}"/><rect x="10" y="5" width="1" height="2" fill="${hair}"/><rect x="3" y="2" width="2" height="1" fill="#fff" opacity=".35"/>`;
  if (st === 1) s += `<rect x="1" y="5" width="1" height="6" fill="${hair}"/><rect x="10" y="5" width="1" height="6" fill="${hair}"/>`;
  if (st === 2) s += `<rect x="0" y="4" width="1" height="4" fill="${hair}"/><rect x="11" y="4" width="1" height="4" fill="${hair}"/><rect x="0" y="4" width="1" height="1" fill="#FF7EA8"/><rect x="11" y="4" width="1" height="1" fill="#FF7EA8"/>`;
  if (st === 3) s += `<rect x="2" y="0" width="8" height="3" fill="${shirt}"/><rect x="1" y="3" width="11" height="1" fill="${shirt}"/><rect x="1" y="3" width="11" height="1" fill="#000" opacity=".25"/><rect x="5" y="1" width="2" height="1" fill="#fff" opacity=".7"/>`;
  return s;
}
function sprite(look, crouch) {
  const hair = HAIR[look[0]], shirt = SHIRT[look[1]], st = look[2];

function renderCard() {
  const ct = $('ct'), cd = $('cd'), why = $('why'), act = $('actions'), note = $('note');
  ct.style.color = 'var(--pink)'; why.innerHTML = ''; act.innerHTML = '';
  note.hidden = !notice; note.textContent = notice;
  const me = residents.find((r) => r.id === myId);
  const mine = me && result.couples.find((c) => c.a.id === myId || c.b.id === myId);
  const tags = (list) => { why.innerHTML = list.map(([t, good]) => `<span class="${good ? '' : 'neg'}">${esc(t)}</span>`).join(''); };
  if (!loaded) { ct.textContent = '마을을 불러오는 중이에요'; cd.textContent = '잠시만 기다려 주세요.'; return; }
  if (sel && sel.k === 'c') {
    const c = result.couples.find((x) => x.a.id + '|' + x.b.id === sel.id);
    if (c) { ct.textContent = `${c.a.nick} ♥ ${c.b.nick} · 궁합 ${c.score}점`; cd.textContent = '지금 마을에서 서로 가장 잘 맞는 짝이에요. 더 높은 점수의 주민이 들어오면 짝이 바뀔 수 있어요.'; tags(c.why); }
  } else if (sel && sel.k === 's') {
    const s = result.solos.find((x) => x.id === sel.id);
    if (s) { ct.style.color = '#E6DCC8'; ct.textContent = `${s.nick} · 솔로`; cd.textContent = `아직 ${THRESHOLD}점 이상인 짝이 없어요. 새 주민이 들어오면 다시 짝을 찾아요.`; }
  } else if (sel && sel.k === 'w') {
    const L = ['동전이 퐁당! 오늘 밤 들어올 새 주민이 기대돼요.', '별똥별이 지나갔어요. 좋은 인연의 기운이 느껴져요.', '우물에 하트 모양 별이 비쳤어요. 인연이 가까이 있대요.', '물결이 잔잔해요. 지금 짝과 오래가라는 뜻이래요.'];
    ct.style.color = '#8FD0FF'; ct.textContent = '소원 우물'; cd.textContent = L[wish % L.length];
  } else if (me) {
    if (mine) { const other = mine.a.id === myId ? mine.b : mine.a; ct.textContent = `나 ♥ ${other.nick} · 궁합 ${mine.score}점`; cd.textContent = '더 잘 맞는 주민이 들어오면 짝이 바뀌거나 솔로존으로 갈 수 있어요.'; tags(mine.why); }
    else { ct.style.color = '#E6DCC8'; ct.textContent = '나는 지금 솔로'; cd.textContent = `마을에 아직 ${THRESHOLD}점 이상인 주민이 없어요. 링크를 친구에게 보내서 주민을 늘려 보세요.`; }
  } else {
    ct.textContent = '궁합 마을에 오신 걸 환영해요';
    cd.textContent = residents.length ? '생년월일시를 넣으면 지금 마을 주민 중 가장 잘 맞는 사람과 자동으로 손을 잡게 돼요.' : '아직 아무도 없어요. 첫 주민이 되어 보세요.';
  }
  if (sel) act.insertAdjacentHTML('beforeend', '<button class="btn ghost" type="button" data-a="back">내 상태 보기</button>');
  const blocked = !api || !myId;
  if (!me) act.insertAdjacentHTML('afterbegin', `<button class="btn" type="button" data-a="join"${blocked ? ' disabled' : ''}>마을에 입장하기</button>`);
  else if (!sel) act.insertAdjacentHTML('beforeend', `<button class="btn ghost" type="button" data-a="edit"${blocked ? ' disabled' : ''}>내 정보 다시 입력</button><button class="btn ghost" type="button" data-a="leave"${blocked ? ' disabled' : ''}>${leaving ? '정말 나갈래요' : '마을 나가기'}</button>`);
}

village.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  if (b.dataset.k === 'w') { wish++; sel = { k: 'w' }; } else sel = { k: b.dataset.k, id: b.dataset.id };
  notice = ''; render();
});
$('actions').addEventListener('click', async (e) => {
  const a = e.target.closest('button[data-a]')?.dataset.a; if (!a) return;
  if (a === 'back') { sel = null; renderCard(); }
  if (a === 'join' || a === 'edit') openForm();
  if (a === 'leave') {
    if (!leaving) { leaving = true; renderCard(); setTimeout(() => { leaving = false; renderCard(); }, 4000); return; }
    leaving = false;
    try { await api.remove(); notice = '마을에서 나왔어요. 언제든 다시 들어올 수 있어요.'; }
    catch (err) { notice = '나가기에 실패했어요. 잠시 후 다시 시도해 주세요.'; }
    renderCard();
  }
});

const look = [1, 0, 0];
function drawPicker() {
  $('styS').innerHTML = STYLES.map((t, i) => `<button type="button" class="sw" style="background:#F4F2FF" aria-pressed="${look[2] === i}" data-g="2" data-i="${i}">${t}</button>`).join('');
  $('hairS').innerHTML = HAIR.map((c, i) => `<button type="button" class="sw" style="background:${c};width:36px" aria-label="머리 색 ${i + 1}" aria-pressed="${look[0] === i}" data-g="0" data-i="${i}"></button>`).join('');
  $('shirtS').innerHTML = SHIRT.map((c, i) => `<button type="button" class="sw" style="background:${c};width:36px" aria-label="옷 색 ${i + 1}" aria-pressed="${look[1] === i}" data-g="1" data-i="${i}"></button>`).join('');
  $('pv').innerHTML = `<span style="transform:scale(1.6);transform-origin:center top;height:78px;display:block">${sprite(look, false)}</span>`;
}
$('form').addEventListener('click', (e) => { const b = e.target.closest('.sw'); if (b) { look[+b.dataset.g] = +b.dataset.i; drawPicker(); } });
$('bu').addEventListener('change', () => { $('bt').disabled = $('bu').checked; });
$('cancel').addEventListener('click', () => $('dlg').close());
function openForm() {
  const me = residents.find((r) => r.id === myId);
  $('dlgT').textContent = me ? '내 정보 다시 입력' : '궁합 마을에 입장하기';
  if (me) { $('nick').value = me.nick; look[0] = me.look[0]; look[1] = me.look[1]; look[2] = me.look[2]; }
  drawPicker(); $('ferr').textContent = '';
  try { $('dlg').showModal(); } catch (e) { $('dlg').setAttribute('open', ''); }
  $('nick').focus();
}
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nick = $('nick').value.trim(), bd = $('bd').value, bt = $('bt').value, unknown = $('bu').checked;
  const err = (m) => { $('ferr').textContent = m; };
  if (!nick) return err('마을에서 쓸 이름을 적어 주세요.');
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(bd);
  if (!m || +m[1] < 1930 || +m[1] > 2026) return err('태어난 날을 골라 주세요.');
  if (!unknown && !/^\d{2}:\d{2}$/.test(bt)) return err('태어난 시간을 넣거나 "시간을 몰라요"를 눌러 주세요.');
  const p = pillars(+m[1], +m[2], +m[3], unknown ? null : +bt.slice(0, 2));
  $('go').disabled = true; err('');
  try { await api.save({ nick: nick.slice(0, 8), p, look: [look[0], look[1], look[2]] }); $('dlg').close(); sel = null; notice = ''; }
  catch (x) { err(x && x.code === 'permission-denied' ? '저장이 거절됐어요. Firebase 보안 규칙을 확인해 주세요.' : '저장하지 못했어요. 잠시 후 다시 시도해 주세요.'); }
  finally { $('go').disabled = false; }
});

/* ---------- 데이터 정리 ---------- */
const okPair = (v) => Array.isArray(v) && v.length === 2 && Number.isInteger(v[0]) && Number.isInteger(v[1]) && v[0] >= 0 && v[0] < 10 && v[1] >= 0 && v[1] < 12;
function clean(id, d) {
  if (!d || typeof d.nick !== 'string' || !d.p) return null;
  const nick = d.nick.trim().slice(0, 8); if (!nick) return null;
  const p = d.p; if (!okPair(p.y) || !okPair(p.m) || !okPair(p.d) || (p.h != null && !okPair(p.h))) return null;
  const L = Array.isArray(d.look) ? d.look : [];
  const lk = [Number.isInteger(L[0]) && L[0] >= 0 && L[0] < HAIR.length ? L[0] : 0, Number.isInteger(L[1]) && L[1] >= 0 && L[1] < SHIRT.length ? L[1] : 0, Number.isInteger(L[2]) && L[2] >= 0 && L[2] < STYLES.length ? L[2] : 0];
  return { id, nick, p: { y: p.y, m: p.m, d: p.d, h: p.h || null }, look: lk };
}
function trackPartner() {
  if (!myId) return;
  const key = 'gm-partner-' + mode;
  const me = residents.find((r) => r.id === myId);
  let prev; try { prev = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { prev = null; }
  if (!me) { try { localStorage.removeItem(key); } catch (e) {} return; }
  const c = result.couples.find((x) => x.a.id === myId || x.b.id === myId);
  const cur = c ? (c.a.id === myId ? c.b : c.a) : null;
  const now = { id: cur ? cur.id : null, nick: cur ? cur.nick : '' };
  if (prev && prev.id !== now.id) {
    if (!prev.id && now.id) notice = `짝이 생겼어요! ${now.nick}님과 손을 잡았어요.`;
    else if (prev.id && !now.id) notice = `${prev.nick}님이 더 잘 맞는 짝을 만나서 솔로가 됐어요.`;
    else notice = `짝이 바뀌었어요. 이제 ${now.nick}님과 커플이에요.`;
  }
  try { localStorage.setItem(key, JSON.stringify(now)); } catch (e) {}
}
function update(list) {
  residents = list; result = pairUp(residents); loaded = true;
  if (sel && sel.k === 'c' && !result.couples.some((x) => x.a.id + '|' + x.b.id === sel.id)) sel = null;
  if (sel && sel.k === 's' && !result.solos.some((x) => x.id === sel.id)) sel = null;
  trackPartner(); render();
}
function showBanner(t) { const b = $('banner'); b.textContent = t; b.hidden = !t; }

let lastW = 0;
new ResizeObserver(() => { if (village.clientWidth !== lastW) { lastW = village.clientWidth; render(); } }).observe(village);
$('thr').textContent = THRESHOLD;

/* ---------- 미리보기 모드 (Firebase 설정 전) ---------- */
function startDemo() {
  mode = 'demo';
  showBanner('미리보기 모드예요. Firebase 설정값을 넣기 전이라 예시 주민이 보이고, 입장해도 이 화면에만 잠깐 추가돼요.');
  const S = [['몽글',1996,3,2,10],['차차',1995,7,21,null],['보리',1993,11,9,22],['율무',1998,5,5,7],['단비',1990,12,25,15],['호두',1994,8,14,3],['콩떡',1997,1,30,12],['모카',1999,6,18,19],['누리',1992,9,9,8],['토리',2000,4,1,null],['자두',1991,2,14,16],['하루',1996,10,3,21]];
  let list = S.map(([n, y, m, d, h], i) => ({ id: 'demo' + i, nick: n, p: pillars(y, m, d, h), look: [i % HAIR.length, (i * 3) % SHIRT.length, i % 4] }));
  myId = 'me';
  api = {
    save: async (data) => { list = list.filter((r) => r.id !== 'me').concat({ id: 'me', ...data }); update(list.slice()); },
    remove: async () => { list = list.filter((r) => r.id !== 'me'); update(list.slice()); }
  };
  update(list.slice());
}

/* ---------- Firebase 모드 ---------- */
async function startLive() {
  mode = 'live'; render();
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  let A, Au, F;
  try { [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]); }
  catch (e) { loaded = true; showBanner('Firebase를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); render(); return; }
  const app = A.initializeApp(FIREBASE_CONFIG);
  const auth = Au.getAuth(app), fs = F.getFirestore(app);
  try { const cred = await Au.signInAnonymously(auth); myId = cred.user.uid; }
  catch (e) { showBanner('익명 로그인을 하지 못했어요. Firebase 콘솔 > Authentication에서 "익명" 로그인을 켜 주세요.'); }
  if (myId) {
    const ref = F.doc(fs, 'residents', myId);
    api = { save: (data) => F.setDoc(ref, { ...data, joinedAt: F.serverTimestamp() }), remove: () => F.deleteDoc(ref) };
  }
  const timer = setTimeout(() => { if (!loaded) { loaded = true; showBanner('마을 정보를 아직 불러오지 못했어요. 연결되면 자동으로 나타나요.'); render(); } }, 10000);
  F.onSnapshot(F.collection(fs, 'residents'), (snap) => {
    clearTimeout(timer);
    if ($('banner').textContent.startsWith('마을 정보를')) showBanner('');
    update(snap.docs.map((d) => clean(d.id, d.data())).filter(Boolean));
  }, (e) => {
    clearTimeout(timer); loaded = true;
    showBanner(e && e.code === 'permission-denied' ? '마을 정보를 읽을 권한이 없어요. Firebase 보안 규칙을 확인해 주세요.' : '마을 정보를 불러오지 못했어요. 페이지를 새로고침해 주세요.');
    render();
  });
}

render();
if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId) startLive(); else startDemo();
</script>
