<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>궁합 마을</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* VOICE: 얼음 바다 옆 눈 마을, 이웃과 놀고 짝과 데이트하는 아기자기한 설렘
   IDEA: 비스듬히 내려다보는 겨울 픽셀 디오라마. 이글루·통나무집·물개·강아지가 사는 마을
   PICTURE: 원근감 있는 눈 마을 지도, 커플 집은 아이소메트릭 방으로 열린다
   COLOUR and TYPE: 하늘빛 눈·얼음 바다, 통나무 갈색, 창문 노랑, 고백 핑크·사주 주황 / Jua + Gowun Dodum
   LAYOUT: 위 상태줄, 가운데 3D 지도(조이스틱·행동 버튼), 아래 정보 카드 */
:root{color-scheme:light;--ink:#1E2A44;--sub:#44506B;--pink:#C8325F;--heart:#F0558A;--saju:#E58A1F;--line:#1E2A44;--snow:#EEF4FB}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:#6E7FC0;color:var(--ink);font:16px/1.5 'Gowun Dodum',sans-serif;overflow:hidden}
.app{position:relative;max-width:520px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;background:#EEF6FF}
.hud{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:10;pointer-events:none}
.hud>*{pointer-events:auto}
h1{margin:0;font:400 20px/1 'Jua',sans-serif;display:flex;align-items:center;gap:6px;white-space:nowrap;background:rgba(255,255,255,.92);border:2.5px solid var(--line);border-radius:999px;padding:6px 13px 6px 10px;box-shadow:0 3px 0 rgba(30,42,68,.25)}
.stats{display:flex;gap:5px;font-size:12px;flex-wrap:wrap;justify-content:flex-end}
.stats span{border-radius:999px;padding:4px 9px;background:rgba(255,255,255,.92);border:2px solid var(--line);font-weight:700;box-shadow:0 2px 0 rgba(30,42,68,.2)}
.stats .c{background:#FFE3EC;color:#8F1F44}
.banner{position:absolute;left:10px;right:10px;top:calc(56px + env(safe-area-inset-top));z-index:10;margin:0;padding:5px 11px;border-radius:12px;background:rgba(255,246,214,.95);border:2px solid #C9A227;font-size:12px;line-height:17px}
.banner[hidden]{display:none}
.vp{position:absolute;inset:0;overflow:hidden;background:#EEF6FF;touch-action:none;perspective:1800px;perspective-origin:50% 45%;isolation:isolate}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:scale(.9) rotateX(60deg) rotateZ(45deg);transform-origin:50% 45%}
.world{position:absolute;left:0;top:0;width:1100px;height:1500px;transform-style:preserve-3d}
.far{position:absolute;left:-1600px;top:-1600px;width:4300px;height:4700px;background-color:#EEF5FD;background-image:radial-gradient(#DDE8F5 1.6px,transparent 1.8px);background-size:30px 30px}
.ground{position:absolute;left:0;top:0;width:1100px;height:1500px;background-color:#F8FBFF;background-image:radial-gradient(#E3EDF8 2px,transparent 2.2px),radial-gradient(#FFFFFF 3px,transparent 3.2px),radial-gradient(rgba(255,214,232,.35) 16px,transparent 17px),radial-gradient(rgba(190,220,250,.35) 14px,transparent 15px);background-size:28px 28px,44px 44px,220px 170px,180px 140px;background-position:0 0,14px 22px,90px 30px,40px 60px;box-shadow:0 0 0 18px #E1EAF5}
.fl{position:absolute;pointer-events:none}
.path{position:absolute;background:#E6EEF7;border:3px solid #C9D8E8;pointer-events:none;background-image:radial-gradient(#D5E1EE 2px,transparent 2.4px);background-size:18px 18px}
.st{position:absolute;transform-origin:50% 100%;transform:rotateZ(-45deg) rotateX(-60deg);pointer-events:none;overflow:visible}
.st.tap{pointer-events:auto}
.shd{position:absolute;border-radius:50%;background:rgba(110,140,200,.18);pointer-events:none}
.pool{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,200,170,.5),rgba(255,214,110,0));pointer-events:none}
.fog{position:absolute;left:0;right:0;top:0;height:22%;background:linear-gradient(#FFF1F7,rgba(255,241,247,0));pointer-events:none;z-index:5}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 50px rgba(120,140,210,.22);pointer-events:none;z-index:5}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.2}}
.tw{animation:tw 1.6s ease-in-out infinite}
@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.8}100%{transform:translate(10px,-40px) scale(1.4);opacity:0}}
.puff{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;animation:puff 3s ease-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.15) translateY(-1px)}}
.flame{transform-origin:bottom;transform-box:fill-box;animation:flick .5s ease-in-out infinite}
@keyframes fall{from{transform:translate(0,-20px)}to{transform:translate(24px,640px)}}
.snow{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.snow i{position:absolute;top:0;border-radius:50%;background:#fff;opacity:.95;animation:fall linear infinite;box-shadow:0 0 2px rgba(80,110,160,.5)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2px) rotate(2deg)}}
.sway{animation:sway 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes walk{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-2px) rotate(-3deg)}75%{transform:translateY(-2px) rotate(3deg)}}
.res.walking .px,.pet.walking .px{animation:walk .36s linear infinite}
@keyframes pop{0%{transform:translateX(-50%) scale(.4);opacity:0}15%{transform:translateX(-50%) scale(1.1);opacity:1}25%{transform:translateX(-50%) scale(1)}100%{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes fw{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-70px) scale(1.2);opacity:0}}
.hp{position:absolute;left:0;top:0;width:20px;height:20px;transform-origin:50% 100%;pointer-events:none}
.hp span{display:block;animation:rise 1.8s ease-out forwards}
@media (prefers-reduced-motion:reduce){.tw,.puff,.flame,.bob,.sway,.res.walking .px,.pet.walking .px,.hp span{animation:none}.snow{display:none}}
.px{display:block;filter:drop-shadow(1px 0 0 #1E2A44) drop-shadow(-1px 0 0 #1E2A44) drop-shadow(0 1px 0 #1E2A44) drop-shadow(0 -1px 0 #1E2A44)}
.res{position:absolute;left:0;top:0;width:44px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;transform-origin:50% 100%}
.res .fig{position:relative;width:36px;height:48px}
.res.left .fig{transform:scaleX(-1)}
.res.lean-r .fig{transform:rotate(7deg)}.res.lean-l .fig{transform:rotate(-7deg)}
.res.left.lean-r .fig{transform:scaleX(-1) rotate(-7deg)}.res.left.lean-l .fig{transform:scaleX(-1) rotate(7deg)}
.res .arm{position:absolute;top:28px;width:14px;height:5px;background:#F7D9C4;border:1.5px solid #1E2A44;border-radius:3px;display:none}
.res.lean-r .arm{display:block;right:-10px}.res.lean-l .arm{display:block;left:-10px}
.res .snowman{display:none}
.res.frozen .fig>svg.px:first-child{display:none}.res.frozen .snowman{display:block}
.tag{font-size:12px;line-height:17px;padding:0 6px;border-radius:999px;background:#fff;border:1.5px solid var(--line);white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px}
.tag .on{width:7px;height:7px;border-radius:50%;background:#3CB371;flex:none}
.res.me .tag{background:#FFD84D;font-weight:700}
.res.love .tag{box-shadow:0 0 0 2px #F0558A}
.res.saju .tag{box-shadow:0 0 0 2px #E58A1F}
.res.sel .tag{outline:3px solid #2457C5;outline-offset:2px}
.res:focus-visible{outline:3px solid #2457C5;outline-offset:2px;border-radius:10px}
.bub{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);background:#fff;border:2px solid var(--line);border-radius:12px;padding:3px 8px;font-size:13px;line-height:18px;max-width:170px;width:max-content;word-break:keep-all;overflow-wrap:anywhere;animation:pop 3s ease-out forwards;pointer-events:none;text-align:center;z-index:2}
.res.cp .bub{bottom:146px}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--line)}
.bub.emo{font-size:24px;line-height:28px;padding:2px 6px}
.mark{position:absolute;right:-6px;top:6px;font-size:16px;pointer-events:none}
.cbadge{position:absolute;left:0;top:0;width:150px;height:60px;transform-origin:50% 100%;pointer-events:none}
.cbadge .ttl{position:absolute;left:0;right:0;margin:0 auto;width:max-content;top:0;font:400 11px/15px 'Jua',sans-serif;white-space:nowrap;background:#fff;border-radius:6px;padding:0 5px;border:1.5px solid}
.cbadge b{position:absolute;left:82px;top:24px;font:400 13px/18px 'Jua',sans-serif;background:#fff;border-radius:6px;padding:0 4px;border:1.5px solid}
.fwk{position:absolute;width:10px;height:10px;border-radius:50%;animation:fw 1.4s ease-out infinite}
.ball{position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #9FB4CC;transform-origin:50% 100%;pointer-events:none}
.item{position:absolute;left:0;top:0;width:28px;height:30px;transform-origin:50% 100%;pointer-events:none}
.pet{position:absolute;left:0;top:0;transform-origin:50% 100%;background:none;border:0;padding:0;cursor:pointer}
.pet.left .px{transform:scaleX(-1)}
.board{font:400 14px/17px 'Jua',sans-serif;background:#8A5A33;border:2px solid #3E2614;border-radius:5px;padding:3px 8px;color:#FFEBD0;text-align:center;white-space:nowrap}
.board small{display:block;font:12px/15px 'Gowun Dodum',sans-serif}
.plate{font:400 12px/16px 'Jua',sans-serif;background:#FFF4F7;border:2px solid #C8325F;color:#8F1F44;border-radius:6px;padding:1px 6px;white-space:nowrap;text-align:center}
.plate.vac{background:#F1F5F9;border-color:#7D8AA6;color:#44506B}
.joy{position:absolute;left:12px;bottom:calc(var(--sh,90px) + 20px);width:108px;height:108px;border-radius:50%;background:rgba(30,42,68,.28);border:3px solid rgba(255,255,255,.8);z-index:8;touch-action:none}
.joy .knob{position:absolute;left:28px;top:28px;width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.joy[hidden],.acts[hidden],.tobtn[hidden],.chatbar[hidden],.emopick[hidden],.toast[hidden],.datebar[hidden]{display:none}
.acts{position:absolute;right:10px;bottom:calc(var(--sh,90px) + 20px);display:flex;flex-direction:column;gap:7px;z-index:8}
.ab{width:48px;height:48px;border-radius:14px;border:3px solid var(--line);background:#fff;font-size:21px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.2);position:relative}
.ab:focus-visible{outline:3px solid #2457C5;outline-offset:2px}
.ab .dot{position:absolute;right:-4px;top:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--heart);color:#fff;font:12px/18px 'Jua',sans-serif;padding:0 4px}
.ab .dot[hidden]{display:none}
.emopick{position:absolute;right:66px;bottom:calc(var(--sh,90px) + 130px);z-index:9;background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px;display:grid;grid-template-columns:repeat(4,44px);gap:4px}
.emopick button{width:44px;height:44px;border:0;background:#F1F5F9;border-radius:10px;font-size:22px;cursor:pointer}
.chatbar{position:absolute;left:8px;right:8px;bottom:calc(var(--sh,90px) + 16px);z-index:9;display:flex;gap:6px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px}
.chatbar input{flex:1;height:44px;border:2px solid #9AA6BF;border-radius:10px;padding:0 10px;font:inherit;font-size:16px}
.tobtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sh,90px) + 20px);z-index:8;min-height:40px;padding:0 12px;border-radius:12px;border:3px solid var(--line);background:#fff;font:400 14px 'Jua',sans-serif;cursor:pointer}
.toast{position:absolute;left:50%;top:calc(96px + env(safe-area-inset-top));transform:translateX(-50%);z-index:9;font-size:13px;background:rgba(30,42,68,.86);color:#fff;border-radius:999px;padding:4px 14px;max-width:92%;text-align:center;pointer-events:none}
.datebar{position:absolute;left:50%;top:calc(128px + env(safe-area-inset-top));transform:translateX(-50%);z-index:8;font:400 13px/18px 'Jua',sans-serif;background:#FFE3EC;color:#8F1F44;border:2px solid #F0558A;border-radius:999px;padding:3px 12px;white-space:nowrap;pointer-events:none}
.sheet{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:10}
.cardin{background:rgba(255,255,255,.95);border:3px solid var(--line);border-radius:18px;padding:10px 13px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 rgba(30,42,68,.3);max-height:46vh;overflow:auto}
.crow{display:flex;align-items:center;gap:8px}.crow .ct{flex:1}
.tog{flex:none;width:40px;height:34px;border-radius:10px;border:2.5px solid var(--line);background:#fff;font:400 14px 'Jua',sans-serif;cursor:pointer}
.tog:focus-visible{outline:3px solid #2457C5;outline-offset:2px}
.sheet.min .cd,.sheet.min .why,.sheet.min .note,.sheet.min .actions,.sheet.min .foot{display:none}
.sheet.min .hearts{font-size:13px}
.ct{font:400 19px/1.25 'Jua',sans-serif;color:var(--pink)}
.cd{font-size:14px;line-height:20px;color:var(--sub)}
.hearts{font-size:15px;letter-spacing:1px}
.hearts[hidden]{display:none}
.why{display:flex;flex-wrap:wrap;gap:4px}.why:empty{display:none}.why span{font-size:12px;background:#FFE3EC;color:#8F1F44;border-radius:6px;padding:1px 6px}.why span.neg{background:#EEF1F5;color:#44506B}
.note{font-size:13px;background:#FFE3EC;color:#8F1F44;border-radius:8px;padding:6px 8px}
.note[hidden]{display:none}
.actions{display:flex;gap:7px;flex-wrap:wrap}.actions:empty{display:none}
.btn{min-height:44px;border-radius:12px;border:3px solid var(--line);background:var(--pink);color:#fff;font:400 16px 'Jua',sans-serif;padding:0 13px;cursor:pointer;box-shadow:0 3px 0 #7A1E3D}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7A1E3D}
.btn.ghost{background:#fff;color:var(--ink);font-size:15px;box-shadow:0 3px 0 #9AA6BF}
.btn.saju{background:#B5650E;box-shadow:0 3px 0 #6E3D08}
.btn.home{background:#2E6B8F;box-shadow:0 3px 0 #1B4560}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.sw:focus-visible{outline:3px solid #2457C5;outline-offset:3px}
.foot{font-size:11px;color:#7D8AA6;margin:0;text-align:center}
dialog{border:3px solid var(--line);border-radius:18px;padding:0;width:min(440px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(20,28,50,.55)}
.dl{padding:16px;display:flex;flex-direction:column;gap:12px}
.dl h2{margin:0;font:400 23px 'Jua',sans-serif}
.f{display:flex;flex-direction:column;gap:4px}
.f label,.f .lb{font-size:14px;font-weight:700}
.in{height:48px;border:2px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:16px;color:var(--ink);background:#fff;width:100%}
.in:focus-visible{outline:3px solid #2457C5;outline-offset:2px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;min-height:44px}
.chk input{width:20px;height:20px;margin:0}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{min-width:36px;height:36px;border-radius:999px;border:2px solid var(--line);cursor:pointer;padding:0 8px;font:13px 'Gowun Dodum',sans-serif;background:#fff;color:var(--ink)}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--line)}
.preview{display:flex;justify-content:center;padding:8px;background:var(--snow);border-radius:12px;height:96px}
.priv{margin:0;font-size:13px;line-height:19px;color:var(--sub);background:#F1F5F9;border-radius:8px;padding:8px 10px}
.err{color:#B42318;font-size:14px;min-height:20px;margin:0}
.big{font:400 38px/1 'Jua',sans-serif;color:var(--pink);text-align:center}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:10px;background:#F4F7FB;border-radius:12px;padding:8px 10px}
.list .grow{flex:1}
.bar{height:8px;border-radius:4px;background:#DCE4EE;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--heart)}
.album{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.photo{background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 6px 8px;box-shadow:0 3px 0 #9AA6BF}
.photo .pic{position:relative;height:96px;border-radius:6px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.photo p{margin:4px 0 0;font-size:12px;line-height:16px;text-align:center}
.empty{font-size:14px;color:var(--sub);text-align:center;padding:16px}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choices .btn{font-size:15px;padding:0 6px}
/* 커플 집 (아이소메트릭 방) */
#room{width:min(500px,calc(100vw - 16px));border-color:#C8325F;background:#FFF0F6}
.rwin{display:flex;flex-direction:column}
.rbar{display:flex;align-items:center;gap:8px;background:#F7A8C6;border-bottom:3px solid #C8325F;padding:6px 10px;font:400 16px 'Jua',sans-serif;color:#7A1E3D}
.rbar .dots{display:flex;gap:4px}.rbar .dots i{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #C8325F}
.rbar .url{flex:1;background:#fff;border-radius:6px;padding:0 8px;font:13px/22px 'Gowun Dodum',sans-serif;color:#8F1F44;border:2px solid #E46C98;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rbody{position:relative;padding:10px;background:#FFE4EF;background-image:radial-gradient(#FFF 2px,transparent 2.4px);background-size:22px 22px}
.rtitle{font:400 24px/1.1 'Jua',sans-serif;color:#C8325F;text-shadow:2px 2px 0 #fff;margin:0 0 4px}
.rstage{position:relative}
.rstage svg{display:block;width:100%;height:auto}
.rinfo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.rinfo div{background:#fff;border:2px solid #E46C98;border-radius:10px;padding:4px 6px;text-align:center;font-size:12px;line-height:16px;color:#8F1F44}
.rinfo b{display:block;font:400 16px 'Jua',sans-serif}
.walls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:#8F1F44;margin-top:8px}
</style>
</head>
<body>
<div class="app" id="app">

<div class="vp" id="vp" aria-label="겨울 궁합 마을 지도">
<div class="tilt" id="tilt"><div class="world" id="world"></div></div>
<div class="fog" aria-hidden="true"></div><div class="vig" aria-hidden="true"></div>
<div class="snow" id="snow" aria-hidden="true"></div>
<div class="toast" id="toast" hidden></div>
<div class="datebar" id="datebar" hidden></div>
<div class="joy" id="joy" hidden aria-label="이동 조이스틱"><div class="knob" id="knob"></div></div>
<div class="acts" id="acts" hidden>
<button class="ab" type="button" id="bEmo" aria-label="감정표현">😊</button>
<button class="ab" type="button" id="bChat" aria-label="말하기">💬</button>
<button class="ab" type="button" id="bThrow" aria-label="눈덩이 던지기">⛄</button>
<button class="ab" type="button" id="bBag" aria-label="가방">🎒</button>
<button class="ab" type="button" id="bMis" aria-label="오늘의 미션">📜<span class="dot" id="misDot" hidden></span></button>

  }

  $('dlgT').textContent = m ? '내 정보 다시 입력' : '궁합 마을에 입장하기';
  if (m) { $('nick').value = m.nick; look[0] = m.look[0]; look[1] = m.look[1]; look[2] = m.look[2]; }
  drawPicker(); $('ferr').textContent = '';
  try { $('dlg').showModal(); } catch (e) { $('dlg').setAttribute('open', ''); }
  $('nick').focus();
}
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nick = $('nick').value.trim(), bd = $('bd').value, bt = $('bt').value, unknown = $('bu').checked;
  const err = (msg) => { $('ferr').textContent = msg; };
  if (!nick) return err('마을에서 쓸 이름을 적어 주세요.');
  const mm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(bd);
  if (!mm || +mm[1] < 1930 || +mm[1] > 2026) return err('태어난 날을 골라 주세요.');
  if (!unknown && !/^\d{2}:\d{2}$/.test(bt)) return err('태어난 시간을 넣거나 "시간을 몰라요"를 눌러 주세요.');
  const p = pillars(+mm[1], +mm[2], +mm[3], unknown ? null : +bt.slice(0, 2));
  $('go').disabled = true; err('');
  try {
    const data = { nick: nick.slice(0, 8), p, look: [look[0], look[1], look[2]] };
    if (mine()) { MC.clear(); await write(data); }
    else {
      me.x = SPAWN.x + Math.round((Math.random() - .5) * 140); me.y = SPAWN.y + Math.round((Math.random() - .5) * 40);
      me.savedX = me.x; me.savedY = me.y; me.init = true; me.movedAt = Date.now();
      await api.create({ ...data, x: me.x, y: me.y, movedAt: me.movedAt, partner: null, confessTo: null, declined: null, auto: true, ping: Date.now() });
      cam.free = false; toast('조이스틱으로 움직여 보세요! 오른쪽 버튼으로 놀 수 있어요');
    }
    $('dlg').close(); sel = null; renderCard();
  } catch (x) { err(x && x.code === 'permission-denied' ? '저장이 거절됐어요. Firebase 보안 규칙을 새 버전으로 바꿨는지 확인해 주세요.' : '저장하지 못했어요. 잠시 후 다시 시도해 주세요.'); }
  finally { $('go').disabled = false; }
});

/* ---------- 데이터 정리 ---------- */
const okPair = (v) => Array.isArray(v) && v.length === 2 && Number.isInteger(v[0]) && Number.isInteger(v[1]) && v[0] >= 0 && v[0] < 10 && v[1] >= 0 && v[1] < 12;
const okId = (v) => typeof v === 'string' && v.length > 0 && v.length <= 128 ? v : null;
const okNum = (v) => typeof v === 'number' && isFinite(v);
const okInt = (v) => Number.isInteger(v) && v >= 0 && v < 10000 ? v : 0;
const obj = (v) => v && typeof v === 'object' && !Array.isArray(v);
function clean(id, d) {
  if (!d || typeof d.nick !== 'string' || !d.p) return null;
  const nick = d.nick.trim().slice(0, 8); if (!nick) return null;
  const p = d.p; if (!okPair(p.y) || !okPair(p.m) || !okPair(p.d) || (p.h != null && !okPair(p.h))) return null;
  const Lk = Array.isArray(d.look) ? d.look : [];
  const lk = [Number.isInteger(Lk[0]) && Lk[0] >= 0 && Lk[0] < HAIR.length ? Lk[0] : 0, Number.isInteger(Lk[1]) && Lk[1] >= 0 && Lk[1] < SHIRT.length ? Lk[1] : 0, Number.isInteger(Lk[2]) && Lk[2] >= 0 && Lk[2] < STYLES.length ? Lk[2] : 0];
  let x, y;
  if (okNum(d.x) && okNum(d.y)) { x = clamp(d.x, 30, MAPW - 30); y = clamp(d.y, 470, MAPH - 20); }
  else { let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 9973; x = SPAWN.x - 100 + (h % 200); y = SPAWN.y - 30 + (h % 50); }
  const r = { id, nick, p: { y: p.y, m: p.m, d: p.d, h: p.h || null }, look: lk, x, y, movedAt: okNum(d.movedAt) ? d.movedAt : 0, ping: okNum(d.ping) ? d.ping : 0,
    partner: okId(d.partner), confessTo: okId(d.confessTo), confessAt: okNum(d.confessAt) ? d.confessAt : 0, auto: d.auto !== false };
  if (obj(d.declined) && okId(d.declined.id)) r.declined = { id: d.declined.id, at: okNum(d.declined.at) ? d.declined.at : 0 };
  if (obj(d.emote) && EMOS.includes(d.emote.k) && okNum(d.emote.at)) r.emote = { k: d.emote.k, at: d.emote.at };
  if (obj(d.say) && typeof d.say.t === 'string' && okNum(d.say.at)) r.say = { t: filt(d.say.t.slice(0, 40)), at: d.say.at };
  if (obj(d.throw) && [d.throw.at, d.throw.x, d.throw.y, d.throw.dx, d.throw.dy].every(okNum)) r.throw = { at: d.throw.at, x: d.throw.x, y: d.throw.y, dx: d.throw.dx, dy: d.throw.dy };
  if (obj(d.gift) && okId(d.gift.to) && ITEMS[d.gift.item] && okNum(d.gift.at)) r.gift = { to: d.gift.to, item: d.gift.item, at: d.gift.at };
  if (obj(d.aff) && okId(d.aff.with)) r.aff = { with: d.aff.with, pts: Math.min(50, okInt(d.aff.pts)) };
  if (obj(d.picked) && typeof d.picked.slot === 'string' && Array.isArray(d.picked.ids)) r.picked = { slot: d.picked.slot, ids: d.picked.ids.filter((i) => typeof i === 'string').slice(0, 30) };
  if (obj(d.inv)) r.inv = { snow: okInt(d.inv.snow), cocoa: okInt(d.inv.cocoa), mitten: okInt(d.inv.mitten), gift: okInt(d.inv.gift) };
  if (obj(d.mis) && typeof d.mis.d === 'string') r.mis = { d: d.mis.d, c: obj(d.mis.c) ? d.mis.c : {}, claimed: Array.isArray(d.mis.claimed) ? d.mis.claimed : [] };
  if (Array.isArray(d.photos)) r.photos = d.photos.filter((ph) => obj(ph) && okId(ph.with) && okNum(ph.at) && typeof ph.spot === 'string').slice(0, 8).map((ph) => ({ spot: ph.spot, with: ph.with, at: ph.at, n1: String(ph.n1 || '').slice(0, 8), n2: String(ph.n2 || '').slice(0, 8) }));
  if (obj(d.home) && HOUSES.some((h) => h.id === d.home.id) && okId(d.home.with) && okNum(d.home.at)) r.home = { id: d.home.id, with: d.home.with, at: d.home.at, wall: WALLS[d.home.wall] ? d.home.wall : 'pink' };
  if (obj(d.date) && okId(d.date.with) && okNum(d.date.at)) r.date = { with: d.date.with, on: d.date.on === true, at: d.date.at };
  if (obj(d.ddate) && typeof d.ddate.key === 'string' && okNum(d.ddate.at)) r.ddate = { key: d.ddate.key.slice(0, 260), on: d.ddate.on === true, at: d.ddate.at };
  if (obj(d.ask) && okId(d.ask.to) && ACTS[d.ask.act] && okNum(d.ask.at)) r.ask = { to: d.ask.to, act: d.ask.act, at: d.ask.at };
  if (obj(d.ans) && okId(d.ans.to) && ACTS[d.ans.act] && okNum(d.ans.at)) r.ans = { to: d.ans.to, act: d.ans.act, ok: d.ans.ok === true, at: d.ans.at };
  return r;
}
function onData(list, definitive) {
  residents = new Map(list.map((r) => [r.id, r]));
  const m = mine();
  if (m && !me.init) { me.x = m.x; me.y = m.y; me.savedX = Math.round(m.x); me.savedY = Math.round(m.y); me.movedAt = m.movedAt; me.init = true; }
  if (m && (!L.ready || pending === 0)) { L.inv = m.inv ? { ...m.inv } : L.inv; L.mis = m.mis || L.mis; L.aff = m.aff || L.aff; L.photos = m.photos || L.photos; L.picked = m.picked || L.picked; L.ready = true; }
  if (!m) { me.init = false; L.ready = false; }
  if (sel && sel.id && !residents.has(sel.id)) sel = null;
  loaded = true;
  computeCouples(); syncPeople(); syncItems(); firstData = false; renderCard();
  $('joy').hidden = !m; $('acts').hidden = !m;
  if (!m) { $('emopick').hidden = true; $('chatbar').hidden = true; }
  updateMisDot();
  if (definitive) reconcile();
}
function showBanner(t) { const b = $('banner'); b.textContent = t; b.hidden = !t; }
setInterval(() => { if (loaded) syncItems(); }, 15000);

/* ---------- 미리보기 모드 ---------- */
function startDemo() {
  showBanner('미리보기 모드예요. 예시 주민들과 이 화면에서만 놀아 볼 수 있어요.');
  const S = [['몽글',1996,3,2,10],['차차',1995,7,21,null],['보리',1993,11,9,22],['율무',1998,5,5,7],['단비',1990,12,25,15],['호두',1994,8,14,3],['콩떡',1997,1,30,12],['모카',1999,6,18,19],['누리',1992,9,9,8],['토리',2000,4,1,null]];
  const spots = [[480,840],[620,850],[300,780],[360,780],[760,1000],[820,1040],[600,1010],[250,1040],[700,1200],[400,1320]];
  const SAY = ['안녕!', '눈 진짜 많이 온다', '같이 걸을래?', '핫초코 주운 사람?', '물개 귀여워!', '이글루 들어가 보고 싶다'];
  const npcs = S.map(([n, y, mo, d, h], i) => ({ id: 'n' + i, nick: n, p: pillars(y, mo, d, h), look: [i % HAIR.length, (i * 3) % SHIRT.length, i % 5], x: spots[i][0], y: spots[i][1], movedAt: i, partner: null, confessTo: null, auto: true, ping: Date.now() }));
  npcs[0].partner = 'n1'; npcs[1].partner = 'n0'; npcs[0].auto = npcs[1].auto = false; npcs[0].aff = { with: 'n1', pts: 50 }; npcs[1].aff = { with: 'n0', pts: 50 };
  npcs[0].home = { id: 'h1', with: 'n1', at: 1, wall: 'pink' };
  let meDoc = null; myId = 'me';
  const all = () => npcs.concat(meDoc ? [meDoc] : []).map((r) => clean(r.id, r)).filter(Boolean);
  const emit = (def = true) => onData(all(), def);
  api = {
    create: async (data) => { meDoc = { id: 'me', ...data }; emit(); setTimeout(npcConfess, 40000); },
    update: async (f) => { if (!meDoc) return; Object.assign(meDoc, f); const quiet = Object.keys(f).every((k) => ['x','y','movedAt','ping','emote','say','throw','inv','picked','mis','aff','photos'].includes(k)); if (!quiet) emit(); if (f.confessTo) setTimeout(() => npcReply(f.confessTo), 1800); if (f.ask) setTimeout(() => npcAnswer(f.ask), 1500); },
    remove: async () => { meDoc = null; npcs.forEach((n) => { if (n.partner === 'me') n.partner = null; if (n.confessTo === 'me') n.confessTo = null; }); emit(); }
  };
  function npcReply(id) {
    const n = npcs.find((x) => x.id === id); if (!n || !meDoc || meDoc.confessTo !== id) return;
    if (scoreOf({ id: 'me', p: meDoc.p }, { id: n.id, p: n.p }).score >= 62) { n.partner = 'me'; n.auto = false; } else n.declined = { id: 'me', at: Date.now() };
    emit();
  }
  function npcAnswer(ask) { const n = npcs.find((x) => x.id === ask.to); if (!n) return; n.ans = { to: 'me', act: ask.act, ok: true, at: Date.now() }; emit(); }
  function npcConfess() { if (!meDoc || coupleOf.has('me') || meDoc.confessTo) return; const f = npcs.find((n) => !coupleOf.has(n.id)); if (f) { f.confessTo = 'me'; f.confessAt = Date.now(); emit(); } }
  setInterval(() => {
    npcs.forEach((n, i) => {
      n.ping = Date.now();
      if (partnerIdOf(n.id) !== 'me' && Math.random() < .3) { n.x = clamp(spots[i][0] + (Math.random() - .5) * 160, 40, MAPW - 40); n.y = clamp(spots[i][1] + (Math.random() - .5) * 120, 500, MAPH - 40); n.movedAt = Date.now(); }
      if (Math.random() < .06) n.emote = { k: EMOS[Math.floor(Math.random() * EMOS.length)], at: Date.now() + i };
      if (Math.random() < .04) n.say = { t: SAY[Math.floor(Math.random() * SAY.length)], at: Date.now() + i };
    });
    emit(false);
  }, 3000);
  emit();
  window.__demo = { npcs, emit };
}

/* ---------- Firebase 모드 ---------- */
async function startLive() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  let A, Au, F;
  try { [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]); }
  catch (e) { loaded = true; showBanner('Firebase를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); renderCard(); return; }
  const app = A.initializeApp(FIREBASE_CONFIG);
  const auth = Au.getAuth(app), fs = F.getFirestore(app);
  try { const cred = await Au.signInAnonymously(auth); myId = cred.user.uid; }
  catch (e) { showBanner('익명 로그인을 하지 못했어요. Firebase 인증 설정(익명 로그인, 승인된 도메인)을 확인해 주세요.'); }
  if (myId) {
    const ref = F.doc(fs, 'residents', myId);
    api = { create: (data) => F.setDoc(ref, { ...data, joinedAt: F.serverTimestamp() }), update: (f) => F.updateDoc(ref, f), remove: () => F.deleteDoc(ref) };
  }
  const timer = setTimeout(() => { if (!loaded) { loaded = true; showBanner('마을 정보를 아직 불러오지 못했어요. 연결되면 자동으로 나타나요.'); renderCard(); } }, 10000);
  F.onSnapshot(F.collection(fs, 'residents'), (snap) => {
    clearTimeout(timer);
    if ($('banner').textContent.startsWith('마을 정보를')) showBanner('');
    onData(snap.docs.map((d) => clean(d.id, d.data())).filter(Boolean), !snap.metadata.fromCache);
  }, (e) => {
    clearTimeout(timer); loaded = true;
    showBanner(e && e.code === 'permission-denied' ? '마을 정보를 읽을 권한이 없어요. Firebase 보안 규칙을 확인해 주세요.' : '마을 정보를 불러오지 못했어요. 페이지를 새로고침해 주세요.');
    renderCard();
  });
}

buildWorld(); buildPets();
if (DEMO) window.__dbg = { me, L, cam, items: () => itemList, sel: (id) => { sel = { id }; uiKey = ''; sheetOpen = true; renderCard(); }, snooze };
cam.x = 550; cam.y = 800;
renderCard();
requestAnimationFrame(frame);
if (DEMO) startDemo(); else startLive();
</script>
